[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gb-ml"
version = "0.1.0"
description = "Case ML ponta a ponta: data quality, observabilidade e previsão de vendas"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
bq = ["google-cloud-bigquery>=3.0", "db-dtypes", "bigframes"]
ml = ["scikit-learn>=1.4", "lightgbm>=4.0", "shap>=0.44"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
