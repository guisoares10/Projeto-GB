# Contrato ilustrativo. Substituir nomes e regras quando o case real chegar.
table_name: exemplo_vendas

target: vendas
date_column: data

grain:
  - data
  - produto_id
  - loja_id

entity_keys:
  - produto_id
  - loja_id

defaults:
  warn_null_pct: 0.05
  error_null_pct: 0.30
  warn_blank_pct: 0.01

columns:
  data:
    type: datetime
    nullable: false
    date_no_future: true
    future_severity: error

  produto_id:
    type: string
    nullable: false

  loja_id:
    type: string
    nullable: false

  vendas:
    type: numeric
    nullable: false
    min: 0
    bounds_severity: error

  preco:
    type: numeric
    nullable: true
    min: 0
    bounds_severity: warn

# Exemplo de catálogo temporal das features.
# No case real, esta seção deve refletir o instante em que cada variável fica disponível.
feature_availability:
  produto_id:
    available_at_prediction: true
    detail: "Conhecido antes do horizonte de previsão."
  loja_id:
    available_at_prediction: true
    detail: "Conhecido antes do horizonte de previsão."
  preco:
    available_at_prediction: true
    detail: "Assumindo preço planejado/conhecido para o horizonte."
  vendas:
    available_at_prediction: false
    detail: "É o target do período corrente; só fica conhecido após a realização."
