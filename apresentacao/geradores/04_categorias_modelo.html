<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Categorias</title>
<style>
  :root {
    --verde: #1d9e75; --verde-escuro: #137a5a; --verde-claro: #e3f5ee; --laranja: #b5562b;
    --tinta: #1a1a1a; --tinta-2: #4a4a4a; --tinta-3: #7a7a7a; --linha: #e3e3dc; --fundo: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1040px; height: 480px; background: var(--fundo);
         font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; color: var(--tinta); }
  .widget { height: 100%; padding: 6px 4px; }
  .rotulo { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--verde);
            margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .rotulo::after { content: ""; flex: 1; height: 1px; background: var(--linha); }

  .cats { width: 100%; border-collapse: collapse; }
  .cats th { font-size: 11px; font-weight: 700; color: var(--tinta-2); text-align: center; padding: 0 6px 6px; vertical-align: bottom; white-space: nowrap; }
  .cats th.esq { text-align: left; }
  .cats th span { display: block; font-size: 9.5px; font-weight: 400; color: var(--tinta-3); margin-top: 2px; }
  .losango { display: inline-block; width: 7px; height: 7px; background: var(--verde); transform: rotate(45deg); margin: 0 1px; }
  .cats td { padding: 5px 6px; border-top: 1px solid #f0f0ea; vertical-align: middle; }
  .cats td svg { display: block; }
  .nome { font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .num { font-size: 12px; color: var(--tinta-3); text-align: center; white-space: nowrap; }
  .faixa.forte { color: var(--laranja); font-weight: 700; }
  .barra { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tinta-2); }
  tr.gift .nome, tr.gift .barra b { color: var(--verde-escuro); }
  .sep { width: 10px; border-top: none !important; }
  .cats th.lado, .cats td.lado { background: var(--verde-claro); }
  .cats td.lado { border-top: 1px solid #d3ece2; }
  .rank { font-size: 11px; color: var(--tinta-3); text-align: right; width: 22px; padding-right: 0 !important; }
  .share { font-size: 13px; font-weight: 700; color: var(--verde-escuro); text-align: right; width: 44px; }
  .forte-s { color: var(--verde-escuro); font-weight: 700; }
  .cats tr:first-child th.lado:first-of-type { border-radius: 8px 0 0 0; }

  .cats th.preco, .cats td.preco { background: #f3f3ef; }
  .cats th.preco { width: 250px; border-radius: 8px 8px 0 0; padding-left: 12px; }
  .cats td.preco { padding-left: 12px; }
  .barra b { white-space: nowrap; }
  .cats .sep { width: 14px; padding: 0; }
  .cats td.preco { border-top: 1px solid #e6e6df; }
  tr.notas td { border-top: none; vertical-align: top; padding: 10px 12px 10px; }
  .nota { font-size: 11.5px; line-height: 1.4; color: var(--tinta-2); }
  .nota b { color: var(--tinta); }
  .nota .tit { display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
  .cats td.nota.d { box-shadow: inset 3px 0 0 var(--laranja); } .nota.d .tit { color: var(--laranja); }
  .cats td.nota.p { box-shadow: inset 3px 0 0 #9a9a90; border-radius: 0 0 8px 8px; } .nota.p .tit { color: var(--tinta-2); }
  .cats td.nota.s { box-shadow: inset 3px 0 0 var(--verde-escuro); border-radius: 0 0 8px 8px; } .nota.s .tit { color: var(--verde-escuro); }
</style>
</head>
<body>
<div class="widget">
  <section>
    <div class="rotulo">Categorias: desconto, preço por item e receita</div>
    {{TABELA}}
  </section>
  <template>
<!--NOTA_DESCONTO--><span class="tit">Desconto oscila</span><b>Facial</b> vai de 29% a 73%, o que pode indicar uma estratégia de <b>liquidação</b>. É possível observar uma <b>estratégia de desconto para cada categoria</b>.<!--/NOTA_DESCONTO-->
<!--NOTA_PRECO--><span class="tit">Gifts: o item mais caro</span><b>{{GIFT_PAGO}} por item</b>, 2× a média da base ({{MEDIA_PAGO}}), com preço de tabela de {{GIFT_TABELA}}. São <b>{{GIFT_ITENS}} dos itens e {{GIFT_REC}} da receita</b>.<!--/NOTA_PRECO-->
<!--NOTA_SHARE--><span class="tit">Share muda com o calendário</span><b>Gifts</b> sai de 5% para 16% da receita em <b>datas comemorativas</b>. As duas <b>perfumarias</b> representam ~50% da receita e <b>revezam o 1º lugar</b> durante os meses.<!--/NOTA_SHARE-->
  </template>
</div>
</body>
</html>
