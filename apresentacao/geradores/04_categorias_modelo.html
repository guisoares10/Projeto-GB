<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Categorias</title>
<style>
  :root {
    --verde: #1d9e75; --verde-escuro: #137a5a; --verde-claro: #e3f5ee; --laranja: #b5562b;
    --tinta: #1a1a1a; --tinta-2: #4a4a4a; --tinta-3: #7a7a7a; --apagado: #a3a39b; --linha: #e3e3dc; --fundo: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1040px; height: 480px; background: var(--fundo);
         font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; color: var(--tinta); }
  .widget { height: 100%; padding: 6px 4px; }
  .rotulo { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--verde);
            margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .rotulo::after { content: ""; flex: 1; height: 1px; background: var(--linha); }
  h3 { font-size: 17px; line-height: 1.25; margin-bottom: 10px; }
  h3 { margin-bottom: 3px; }
  .sub { font-size: 13px; color: var(--tinta-2); margin-bottom: 8px; }
  .sub b { color: var(--tinta); } .sub b.g { color: var(--verde-escuro); } .sub b.f { color: var(--laranja); }

  .cats { width: 100%; border-collapse: collapse; }
  .cats th { font-size: 11px; font-weight: 700; color: var(--tinta-2); text-align: center; padding: 8px 8px 6px; vertical-align: bottom; white-space: nowrap; }
  .cats th.esq { text-align: left; }
  .cats th span { display: block; font-size: 9.5px; font-weight: 400; color: var(--tinta-3); margin-top: 2px; }
  .cats td { padding: 4px 8px; vertical-align: middle; }
  .cats td svg { display: block; }
  svg text { font-family: Arial, sans-serif; }
  .amp { font-size: 11.5px; font-weight: 700; }
  .nome { font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  tr.outra .nome { color: var(--apagado); font-weight: 400; }
  tr.facial .nome { color: var(--laranja); }
  tr.gift .nome { color: var(--verde-escuro); }
  .barra { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--apagado); }
  .barra b { white-space: nowrap; font-weight: 400; }
  tr.gift .barra b { color: var(--verde-escuro); font-weight: 700; }
  .share { font-size: 13px; font-weight: 700; color: var(--tinta-2); text-align: right; width: 48px; }
  tr.outra .share, tr.facial .share { color: var(--apagado); font-weight: 400; }
  tr.gift .share { color: var(--verde-escuro); }

  /* zonas */
  .cats tr > :nth-child(-n+2) { background: #fcf7f3; }
  .cats tr:not(.notas) > td:nth-child(-n+2) { border-top: 1px solid #f3e6dc; }
  .cats tr:first-child > th:first-child { border-radius: 8px 0 0 0; }
  .cats tr:first-child > th:nth-child(2) { border-radius: 0 8px 0 0; }
  .cats tr.notas > td:first-child { border-radius: 0 0 8px 8px; }
  .cats th.preco, .cats td.preco { background: #f9f9f7; }
  .cats th.preco { width: 300px; border-radius: 8px 8px 0 0; padding-left: 12px; }
  .cats td.preco { padding-left: 12px; border-top: 1px solid #ececE6; }
  .cats th.lado, .cats td.lado { background: var(--verde-claro); }
  .cats td.lado { border-top: 1px solid #d3ece2; }
  .cats th.lado { border-radius: 8px 8px 0 0; }
  .cats .sep { width: 14px; padding: 0; background: none !important; border-top: none !important; }

  tr.notas td { border-top: none; vertical-align: top; padding: 10px 12px; }
  .nota { font-size: 11.5px; line-height: 1.4; color: var(--tinta-2); }
  .nota b { color: var(--tinta); }
  .nota .tit { display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
  .cats td.nota.d { box-shadow: inset 3px 0 0 var(--laranja); } .nota.d .tit { color: var(--laranja); }
  .cats td.nota.p { box-shadow: inset 3px 0 0 var(--verde); border-radius: 0 0 8px 8px; } .nota.p .tit { color: var(--verde-escuro); }
  .cats td.nota.s { box-shadow: inset 3px 0 0 var(--tinta-2); border-radius: 0 0 8px 8px; } .nota.s .tit { color: var(--tinta-2); }
</style>
</head>
<body>
<div class="widget">
  <div class="rotulo">Categorias: desconto, preço por item e receita</div>
  <h3>Categorias têm papéis distintos no portfólio</h3>
  <div class="sub"><b>Perfumaria</b> concentra receita · <b class="g">Gifts</b> captura valor · <b class="f">Facial</b> concentra intensidade promocional</div>
  {{TABELA}}
  <template>
<!--NOTA_DESCONTO--><span class="tit">Facial depende de desconto</span>Maior oscilação da base: de <b>29% a 73%</b> entre os meses, o que pode indicar <b>liquidação</b>. Cada categoria segue uma estratégia de desconto própria.<!--/NOTA_DESCONTO-->
<!--NOTA_PRECO--><span class="tit">Gifts captura valor</span><b>{{GIFT_PAGO}} por item</b>, ~2× a média da base ({{MEDIA_PAGO}}): {{GIFT_ITENS}} dos itens e <b>{{GIFT_REC}} da receita</b>.<!--/NOTA_PRECO-->
<!--NOTA_SHARE--><span class="tit">Perfumaria concentra receita</span>As duas perfumarias somam <b>~{{PERF_SH}} da receita</b> e revezam o 1º lugar. <b>Gifts</b> vai de {{GIFT_MIN}} a {{GIFT_MAX}} nas datas comemorativas.<!--/NOTA_SHARE-->
  </template>
</div>
</body>
</html>
